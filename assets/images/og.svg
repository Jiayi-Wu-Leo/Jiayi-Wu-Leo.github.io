<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Jiayi Wu</title>
  <desc id="description">A minimal personal profile card with Jiayi Wu's portrait.</desc>

  <defs>
    <style>
      @font-face {
        font-family: "Chakra Petch OG";
        src: url("../fonts/chakra-petch/ChakraPetch-Medium.ttf") format("truetype");
        font-style: normal;
        font-weight: 500;
      }
    </style>
    <radialGradient id="mintGlow" cx="0" cy="1" r="0.82">
      <stop offset="0" stop-color="#bce6e2" stop-opacity="0.54"/>
      <stop offset="0.58" stop-color="#dff3f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="1" cy="0" r="0.86">
      <stop offset="0" stop-color="#c8dcf5" stop-opacity="0.56"/>
      <stop offset="0.6" stop-color="#e5edf9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="1" cy="1" r="0.72">
      <stop offset="0" stop-color="#ded1ef" stop-opacity="0.52"/>
      <stop offset="0.62" stop-color="#eee8f6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peachGlow" cx="0" cy="0" r="0.66">
      <stop offset="0" stop-color="#f1ddd4" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#f7ece7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72adb8"/>
      <stop offset="0.52" stop-color="#89a6c3"/>
      <stop offset="1" stop-color="#9d94bd"/>
    </linearGradient>
    <linearGradient id="portraitRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#d7eceb" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#e6dff2" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="portraitClip">
      <rect x="698" y="130" width="334" height="370" rx="50"/>
    </clipPath>
    <filter id="portraitShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#667792" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#fafbfc"/>
  <rect width="1200" height="630" fill="url(#peachGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#mintGlow)"/>
  <rect width="1200" height="630" fill="url(#violetGlow)"/>

  <text x="170" y="353"
        fill="url(#nameGradient)"
        font-family="'Chakra Petch OG', 'Chakra Petch', sans-serif"
        font-size="96"
        font-weight="500"
        letter-spacing="-1.5">Jiayi Wu</text>

  <g filter="url(#portraitShadow)">
    <rect x="690" y="122" width="350" height="386" rx="61" fill="url(#portraitRing)"/>
    <rect x="695" y="127" width="340" height="376" rx="55" fill="#f5f7f9"/>
    <image href="Personal Icon.png"
           xlink:href="Personal Icon.png"
           x="628" y="36" width="464" height="464"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#portraitClip)"/>
    <rect x="698" y="130" width="334" height="370" rx="50" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="3"/>
  </g>
</svg>
